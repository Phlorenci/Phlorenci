<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2be9c8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2be9c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #090d13; }
    .node { fill: #2be9c8; }
    .edge { stroke: #2be9c8; stroke-width: 1; }
    .panel { fill: #10161f; stroke: #24303f; stroke-width: 1; }
    .bar { fill: #141b26; }
    .dot { fill: #2be9c8; }
    .title { font-family: 'Courier New', monospace; font-size: 12px; fill: #566072; }
    .line { font-family: 'Courier New', monospace; font-size: 15px; fill: #8a97a6; }
    .prompt { fill: #2be9c8; }
    .accent { fill: #2be9c8; font-weight: bold; }
    .name { font-family: 'Georgia', serif; font-size: 26px; fill: #e7edf3; font-weight: bold; }
    .role { font-family: 'Courier New', monospace; font-size: 13px; fill: #5b8cff; }
    .icon { font-size: 22px; }
    .icon-label { font-family: 'Courier New', monospace; font-size: 10px; fill: #566072; }

    @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.65; } }
    @keyframes drift { 0% { transform: translate(0,0); } 50% { transform: translate(6px,-5px); } 100% { transform: translate(0,0); } }
    @keyframes type { 0% { opacity:0; } 6% { opacity:1; } 82% { opacity:1; } 90% { opacity:0; } 100% { opacity:0; } }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .n1 { animation: pulse 3.2s ease-in-out infinite; }
    .n2 { animation: pulse 4.1s ease-in-out infinite 0.4s; }
    .n3 { animation: pulse 3.6s ease-in-out infinite 0.9s; }
    .n4 { animation: pulse 3.9s ease-in-out infinite 1.3s; }
    .n5 { animation: pulse 3.3s ease-in-out infinite 0.6s; }
    .n6 { animation: pulse 4.4s ease-in-out infinite 1.8s; }
    .net { animation: drift 10s ease-in-out infinite; }

    .l1 { animation: type 8s ease-in-out infinite; animation-delay: 0s; }
    .l2 { animation: type 8s ease-in-out infinite; animation-delay: 0.4s; }
    .l3 { animation: type 8s ease-in-out infinite; animation-delay: 0.8s; }
    .l4 { animation: type 8s ease-in-out infinite; animation-delay: 1.2s; }
    .cursor { animation: blink 1s step-end infinite; }

    .ic1 { animation: bob 2.6s ease-in-out infinite; }
    .ic2 { animation: bob 2.6s ease-in-out infinite 0.5s; }
    .ic3 { animation: bob 2.6s ease-in-out infinite 1s; }
    .ic4 { animation: bob 2.6s ease-in-out infinite 1.5s; }
  </style>

  <rect class="bg" width="900" height="260" rx="16"/>
  <circle cx="700" cy="90" r="180" fill="url(#glow)"/>

  <!-- animated node network background -->
  <g class="net" filter="url(#soft)">
    <line class="edge" x1="560" y1="40" x2="650" y2="90" opacity="0.25"/>
    <line class="edge" x1="650" y1="90" x2="600" y2="160" opacity="0.2"/>
    <line class="edge" x1="600" y1="160" x2="720" y2="190" opacity="0.25"/>
    <line class="edge" x1="720" y1="190" x2="800" y2="120" opacity="0.2"/>
    <line class="edge" x1="800" y1="120" x2="650" y2="90" opacity="0.15"/>
    <line class="edge" x1="560" y1="40" x2="600" y2="160" opacity="0.15"/>
    <line class="edge" x1="720" y1="190" x2="840" y2="60" opacity="0.15"/>
    <circle class="node n1" cx="560" cy="40" r="3"/>
    <circle class="node n2" cx="650" cy="90" r="3.5"/>
    <circle class="node n3" cx="600" cy="160" r="3"/>
    <circle class="node n4" cx="720" cy="190" r="4"/>
    <circle class="node n5" cx="800" cy="120" r="3"/>
    <circle class="node n6" cx="840" cy="60" r="3"/>
  </g>

  <!-- left: identity block -->
  <text x="36" y="60" class="name">Bobur Mirzarakhimov</text>
  <text x="36" y="82" class="role">Computer Engineering Student · Cybersecurity &amp; Systems</text>

  <!-- terminal typing block -->
  <rect class="panel" x="36" y="104" width="470" height="120" rx="10"/>
  <rect class="bar" x="36" y="104" width="470" height="26" rx="10"/>
  <circle class="dot" cx="54" cy="117" r="4" opacity="0.7"/>
  <circle class="dot" cx="68" cy="117" r="4" opacity="0.3"/>
  <circle class="dot" cx="82" cy="117" r="4" opacity="0.3"/>
  <text x="100" y="121" class="title">~/bobur --status</text>

  <text class="line l1" x="52" y="152"><tspan class="prompt">$ </tspan>scan --interests</text>
  <text class="line l2" x="52" y="174">cybersecurity · linux · networks</text>
  <text class="line l3" x="52" y="196">operating systems · git · python · c</text>
  <text class="line l4" x="52" y="218"><tspan class="accent">[OK]</tspan> ready to collaborate <tspan class="cursor">_</tspan></text>

  <!-- right: focus area -->
  <g class="ic4"><text x="680" y="240" class="icon">🛡️</text><text x="668" y="255" class="icon-label">security</text></g>
</svg>
