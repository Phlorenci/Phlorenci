<svg width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #090d13; }
    .bar { fill: #10161f; }
    .dot { fill: #2be9c8; }
    .title { font-family: 'Courier New', monospace; font-size: 12px; fill: #566072; }
    .line { font-family: 'Courier New', monospace; font-size: 16px; fill: #8a97a6; opacity: 0; }
    .prompt { fill: #2be9c8; }
    .accent { fill: #2be9c8; font-weight: bold; }
    .cursor { fill: #2be9c8; }
    @keyframes reveal { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .l1 { animation: reveal 0.4s ease forwards; animation-delay: 0.3s; }
    .l2 { animation: reveal 0.4s ease forwards; animation-delay: 1.1s; }
    .l3 { animation: reveal 0.4s ease forwards; animation-delay: 2.0s; }
    .l4 { animation: reveal 0.4s ease forwards; animation-delay: 2.9s; }
    .l5 { animation: reveal 0.4s ease forwards; animation-delay: 3.8s; }
    .l6 { animation: reveal 0.4s ease forwards; animation-delay: 4.7s; }
    .cursor { animation: blink 1s step-end infinite; animation-delay: 5s; }
  </style>

  <rect class="bg" width="800" height="230" rx="14"/>
  <rect class="bar" width="800" height="36" rx="14"/>
  <rect class="bar" y="14" width="800" height="22"/>
  <circle class="dot" cx="24" cy="18" r="5" opacity="0.7"/>
  <circle class="dot" cx="42" cy="18" r="5" opacity="0.35"/>
  <circle class="dot" cx="60" cy="18" r="5" opacity="0.35"/>
  <text x="90" y="23" class="title">bobur@root: ~</text>

  <text class="line l1" x="24" y="70"><tspan class="prompt">$ </tspan>whoami</text>
  <text class="line l2" x="24" y="96">bobur_mirzarakhimov — computer engineering student</text>
  <text class="line l3" x="24" y="122"><tspan class="prompt">$ </tspan>cat interests.txt</text>
  <text class="line l4" x="24" y="148">cybersecurity · networks · linux · chess · music production</text>
  <text class="line l5" x="24" y="174"><tspan class="prompt">$ </tspan>status --check</text>
  <text class="line l6" x="24" y="200"><tspan class="accent">[OK]</tspan> open to collaboration <tspan class="cursor">_</tspan></text>
</svg>
